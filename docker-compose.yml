# Local backend for testing the full submit → re-simulate → verify loop.
#   docker compose up -d      # start Postgres + Redis
#   docker compose down       # stop
#   docker compose down -v     # stop + wipe data
services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_PASSWORD: bullrush
            POSTGRES_DB: bullrush
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 2s
            timeout: 3s
            retries: 30
    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 2s
            timeout: 3s
            retries: 30

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  game:
    name: game (typecheck, sim:check, sim:test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # A fresh CI checkout never has the gitignored, unlicensed local music files,
      # so this passes here by construction — it exists to catch a future deploy
      # or commit that reintroduces them, not to pass by accident.
      - run: npm run check-assets
      - run: npm run typecheck
      # Non-mutating: fails if server/src/sim/* has drifted from src/sim/* (i.e.
      # someone edited the sim without running `npm run sim:sync`).
      - run: npm run sim:check
      - run: npm run sim:test
      - run: npm run build

  server:
    name: server (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  grid-integration:
    name: grid lifecycle (real Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: bullrush
          POSTGRES_DB: bullrush
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cd server && npm ci
      - run: npm run test:grid
